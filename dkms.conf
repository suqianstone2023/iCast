PACKAGE_NAME="icast"
PACKAGE_VERSION="1.0"
PACKAGE_MAINTAINER="iCast native build contributors"

# Build against the kernel being installed for, not the running one.
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make clean"
AUTOINSTALL="yes"

BUILT_MODULE_NAME[0]="dvb-usb-icast-fe"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/extra/icast"

BUILT_MODULE_NAME[1]="dvb-usb-icast-smit"
BUILT_MODULE_LOCATION[1]="."
DEST_MODULE_LOCATION[1]="/extra/icast"
