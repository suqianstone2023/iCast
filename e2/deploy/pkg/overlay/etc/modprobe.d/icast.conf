# modprobe 配置 for iCast DVB-C USB dongle (29df:0001)

# 加载顺序是硬性的：fe 必须先于 smit，否则 icast_fe_attach 拿不到符号，
# probe 会打出 "not attached iCast usb device"。
softdep dvb_usb_icast_smit pre: dvb_usb_icast_fe

# 不给这个的话，热重启后固件缓冲里残留的 DTMB:Y 会把前端翻成 FE_OFDM，
# E2 把有线 tuner 当 DVB-T 处理，扫完是空列表、画面全黑。
options dvb_usb_icast_smit icast_mode=dvbc
